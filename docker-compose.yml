services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eroverwatch
      POSTGRES_PASSWORD: eroverwatch
      POSTGRES_DB: eroverwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "devkey: secret"

volumes:
  postgres_data:
  redis_data:
